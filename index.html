<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ذكريات ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}


/* =========================
   الشاشة الأولى
========================= */

#intro {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: black;
}


/* الصور */

.photos {
    position: absolute;
    inset: -5%;
}

.photo {
    position: absolute;
    background-size: cover;
    background-position: center;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.7);
    filter: brightness(.45);
}

    height: 100%;

</head>


<body>


<!-- =========================
     الشاشة الأولى
========================= -->

<div id="intro">

    <div class="photos">

        <!-- ترتيب الصور من 6 إلى 1 -->

        <div class="photo photo6"></div>
        <div class="photo photo5"></div>
        <div class="photo photo4"></div>
        <div class="photo photo3"></div>
        <div class="photo photo2"></div>
        <div class="photo photo1"></div>

    </div>


    <div class="dark"></div>


    <div class="text">

        <h1>
            من شخص
        </h1>

        <p>
            ردت أنطيج هدية هاج ❤️
        </p>

        <button onclick="startHeart()">
            🖕🏿🖕🏻
        </button>

    </div>

</div>



<!-- =========================
     شاشة القلب
========================= -->

<div id="heartScreen">

    <canvas id="heart"></canvas>

</div>



<script>

/* =========================
   إعداد Canvas
========================= */

const canvas = document.getElementById("heart");

const ctx = canvas.getContext("2d");


function resize() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}


resize();


window.addEventListener("resize", resize);



/* =========================
   معادلة القلب
========================= */

function heart(a, scale) {

    const x =
        16 *
        Math.pow(Math.sin(a), 3) *
        scale;

    const y =
        (
            13 * Math.cos(a)
            - 5 * Math.cos(2 * a)
            - 2 * Math.cos(3 * a)
            - Math.cos(4 * a)
        ) * scale;

    return {
        x: x,
        y: y
    };

}



/* =========================
   تشغيل القلب
========================= */

function startHeart() {

    document.getElementById("intro").style.display = "none";

    document.getElementById("heartScreen").style.display = "block";

    resize();

    createHeart();

}



/* =========================
   إنشاء الجزيئات
========================= */

function createHeart() {

    const particles = [];


    /* الجزيئات الداخلية */

    for (let i = 0; i < 5000; i++) {

        const a =
            Math.random() *
            Math.PI * 2;

        const sc =
            0.5 +
            Math.random() * 15.5;

        const h =
            heart(a, sc);

        const ang =
            Math.atan2(h.y, h.x) +
            (Math.random() - 0.5) * 0.5;


        particles.push({

            x: h.x,

            y: h.y,

            ang: ang,

            length:
                4 +
                Math.random() * 10,

            alpha:
                0.35 +
                Math.random() * 0.3

        });

    }



    /* جزيئات الحواف */

    for (let i = 0; i < 3500; i++) {

        const a =
            Math.random() *
            Math.PI * 2;

        const h =
            heart(a, 16);

        const ang =
            Math.atan2(h.y, h.x) +
            (Math.random() - 0.5) * 0.35;


        particles.push({

            x:
                h.x +
                (Math.random() - 0.5) * 4,

            y:
                h.y +
                (Math.random() - 0.5) * 4,

            ang: ang,

            length:
                10 +
                Math.random() * 22,

            alpha:
                0.55 +
                Math.random() * 0.4

        });

    }


    let progress = 0;



    /* =========================
       رسم القلب
    ========================= */

    function draw() {

        ctx.fillStyle =
            "rgba(0,0,0,0.25)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.save();


        ctx.translate(
            canvas.width / 2,
            canvas.height / 2
        );


        const scale =
            Math.min(
                canvas.width,
                canvas.height
            ) / 700;


        ctx.scale(
            scale,
            -scale
        );


        const visible =
            Math.min(
                particles.length,
                Math.floor(progress)
            );


        for (
            let i = 0;
            i < visible;
            i++
        ) {

            const p =
                particles[i];


            ctx.strokeStyle =
                `rgba(
                    255,
                    ${80 + Math.random() * 120},
                    ${165 + Math.random() * 90},
                    ${p.alpha}
                )`;


            ctx.lineWidth = 0.7;


            ctx.beginPath();


            ctx.moveTo(
                p.x,
                p.y
            );


            ctx.lineTo(
                p.x +
                p.length *
                Math.cos(p.ang),

                p.y +
                p.length *
                Math.sin(p.ang)
            );


            ctx.stroke();

        }


        ctx.restore();


        if (progress < particles.length) {

            progress += 18;

            setTimeout(
                () => requestAnimationFrame(draw),
                12
            );

        }

    }


    draw();

}

</script>

</body>
</html>
